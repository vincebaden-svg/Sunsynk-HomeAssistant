blueprint:
  name: "Sunsynk: Low Battery Alert"
  description: >
    Sends a Telegram notification when battery SOC drops below threshold.
  domain: automation
  source_url: https://github.com/vincebaden-svg/Sunsynk-HomeAssistant
  input:
    chat_id:
      name: Telegram Chat ID
      description: "Your Telegram chat ID"
      selector:
        number:
          min: 0
          max: 9999999999
          mode: box

trigger:
  - platform: event
    event_type: sunsynk_battery_low

action:
  - action: telegram_bot.send_message
    data:
      target: !input chat_id
      message: "🔋 Battery low! SOC at {{ trigger.event.data.soc | round(0) }}% (threshold: {{ trigger.event.data.threshold | round(0) }}%). Consider reducing load."
