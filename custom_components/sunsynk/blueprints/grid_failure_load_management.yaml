blueprint:
  name: "Sunsynk: Grid Failure Notification"
  description: >
    Sends a Telegram notification when the grid fails or is restored.
    Optionally turns off a switch on grid failure and back on when restored.
  domain: automation
  source_url: https://github.com/vincebaden-svg/Sunsynk-HomeAssistant
  input:
    chat_id:
      name: Telegram Chat ID
      description: "Your Telegram chat ID (number from BotFather getUpdates)"
      selector:
        number:
          min: 0
          max: 9999999999
          mode: box
    use_switch:
      name: Control a switch on grid failure?
      description: "Enable to turn off a switch when grid fails"
      default: false
      selector:
        boolean:
    control_switch:
      name: Switch to Control
      description: "Switch to turn OFF on grid failure and ON when restored (only used if above is enabled)"
      default: switch.none
      selector:
        entity:
          domain: switch

trigger:
  - platform: event
    event_type: sunsynk_grid_failure
    id: grid_failure
  - platform: event
    event_type: sunsynk_grid_restored
    id: grid_restored

action:
  - choose:
      - conditions:
          - condition: trigger
            id: grid_failure
        sequence:
          - action: telegram_bot.send_message
            data:
              chat_id: !input chat_id
              message: "⚡ Grid failure detected. Battery at {{ trigger.event.data.battery_soc | round(0) }}%. Avoid heavy loads."
          - condition: template
            value_template: "{{ use_switch }}"
          - action: switch.turn_off
            target:
              entity_id: !input control_switch
      - conditions:
          - condition: trigger
            id: grid_restored
        sequence:
          - action: telegram_bot.send_message
            data:
              chat_id: !input chat_id
              message: "✅ Grid restored. Battery at {{ trigger.event.data.battery_soc | round(0) }}%."
          - condition: template
            value_template: "{{ use_switch }}"
          - action: switch.turn_on
            target:
              entity_id: !input control_switch

variables:
  use_switch: !input use_switch
