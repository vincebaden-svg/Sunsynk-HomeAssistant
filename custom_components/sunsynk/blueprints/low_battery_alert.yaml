blueprint:
  name: "Sunsynk: Low Battery Alert"
  description: >
    Sends a notification when battery SOC drops below the configured threshold.
    Works with any notify entity (Telegram, mobile app, email, etc.).
  domain: automation
  source_url: https://github.com/vincebaden-svg/Sunsynk-HomeAssistant
  input:
    notify_entity:
      name: Notification Entity
      description: "Select your notification entity (e.g. Telegram chat, mobile app)"
      selector:
        entity:
          domain: notify

trigger:
  - platform: event
    event_type: sunsynk_battery_low

action:
  - action: notify.send_message
    target:
      entity_id: !input notify_entity
    data:
      message: "🔋 Battery low! SOC at {{ trigger.event.data.soc | round(0) }}% (threshold: {{ trigger.event.data.threshold | round(0) }}%). Consider reducing load."
      title: "Low Battery"
