blueprint:
  name: "Sunsynk: Summer Load Priority Switching"
  description: >
    Automatically switches the inverter to load priority mode when solar generation
    is high and battery is full. Saves money by using solar directly instead of
    cycling through the battery.
  domain: automation
  source_url: https://github.com/vinbaden/ha-sunsynk
  input:
    pv_threshold:
      name: PV Generation Threshold (W)
      description: "Switch to load priority when PV generation exceeds this value"
      default: 3000
      selector:
        number:
          min: 0
          max: 20000
          unit_of_measurement: "W"
    soc_threshold:
      name: Battery SOC Threshold (%)
      description: "Switch to load priority when battery SOC exceeds this value"
      default: 95
      selector:
        number:
          min: 0
          max: 100
          unit_of_measurement: "%"
    time_start:
      name: Active Window Start
      description: "Only switch during this time window (start)"
      default: "08:00:00"
      selector:
        time:
    time_end:
      name: Active Window End
      description: "Only switch during this time window (end)"
      default: "16:00:00"
      selector:
        time:

trigger:
  - platform: event
    event_type: sunsynk_daily_summary

condition:
  - condition: time
    after: !input time_start
    before: !input time_end

action:
  - service: select.select_option
    target:
      entity_id: select.sunsynk_work_mode
    data:
      option: "self_use"
