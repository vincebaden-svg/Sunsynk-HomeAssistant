blueprint:
  name: "Sunsynk: Grid Failure Notification"
  description: >
    Sends a notification when the grid fails or is restored.
    Works with any notify entity (Telegram, mobile app, email, etc.).
    Optionally turns off a switch on grid failure and back on when restored.
  domain: automation
  source_url: https://github.com/vincebaden-svg/Sunsynk-HomeAssistant
  input:
    notify_entity:
      name: Notification Entity
      description: "Select your notification entity (e.g. Telegram chat, mobile app, email)"
      selector:
        entity:
          domain: notify
    control_switch:
      name: Switch to Control (optional)
      description: "A switch to turn OFF on grid failure and ON when restored. Leave empty to skip."
      default: ""
      selector:
        entity:
          domain: switch

variables:
  switch_entity: !input control_switch

trigger:
  - platform: event
    event_type: sunsynk_grid_failure
    id: grid_failure
  - platform: event
    event_type: sunsynk_grid_restored
    id: grid_restored

action:
  - choose:
      - conditions:
          - condition: trigger
            id: grid_failure
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notify_entity
            data:
              message: "⚡ Grid failure detected. Battery at {{ trigger.event.data.battery_soc | round(0) }}%. Avoid heavy loads."
              title: "Grid Failure"
          - condition: template
            value_template: "{{ switch_entity != '' }}"
          - action: switch.turn_off
            target:
              entity_id: !input control_switch
      - conditions:
          - condition: trigger
            id: grid_restored
        sequence:
          - action: notify.send_message
            target:
              entity_id: !input notify_entity
            data:
              message: "✅ Grid restored. Battery at {{ trigger.event.data.battery_soc | round(0) }}%."
              title: "Grid Restored"
          - condition: template
            value_template: "{{ switch_entity != '' }}"
          - action: switch.turn_on
            target:
              entity_id: !input control_switch
